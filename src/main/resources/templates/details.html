<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head th:replace="~{fragments/header :: head}"></head>
<body class="overflow-x-hidden">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <div class="mb-6">
        <a th:href="@{/}" class="text-brand-500 hover:text-brand-700 font-semibold transition">&larr; Terug naar overzicht</a>
    </div>

    <div class="bg-white rounded-2xl card-shadow p-8 max-w-3xl">
        <h1 class="text-3xl font-extrabold text-brand-900 mb-6" th:text="${evenement.titel}">Titel</h1>

        <dl class="space-y-5">
            <div class="border-l-4 border-brand-400 pl-4">
                <dt class="text-xs font-bold text-brand-500 uppercase tracking-wider">Tijdstip</dt>
                <dd class="text-brand-900 font-medium mt-1" th:text="${#temporals.format(evenement.tijdstip, 'dd/MM/yyyy HH:mm')}">Datum</dd>
            </div>
            <div class="border-l-4 border-brand-400 pl-4">
                <dt class="text-xs font-bold text-brand-500 uppercase tracking-wider">Omschrijving</dt>
                <dd class="text-brand-800 mt-1" th:text="${evenement.omschrijving}">Omschrijving</dd>
            </div>
            <div class="border-l-4 border-brand-400 pl-4">
                <dt class="text-xs font-bold text-brand-500 uppercase tracking-wider">Organisatie</dt>
                <dd class="text-brand-800 font-medium mt-1" th:text="${evenement.organisatie}">Organisatie</dd>
            </div>
            <div class="border-l-4 border-accent-400 pl-4">
                <dt class="text-xs font-bold text-accent-500 uppercase tracking-wider">Contactpersoon</dt>
                <dd class="text-brand-800 font-medium mt-1" th:text="${evenement.mailContactpersoon}">Email</dd>
            </div>
            <div th:if="${evenement.locatie != null}" class="border-l-4 border-brand-600 pl-4">
                <dt class="text-xs font-bold text-brand-500 uppercase tracking-wider">Locatie</dt>
                <dd class="text-brand-900 font-medium mt-1">
                    <span th:text="${evenement.locatie.naam}">Naam</span><br>
                    <span class="text-brand-600" th:text="${evenement.locatie.adres}">Adres</span><br>
                    <span class="text-brand-500 text-sm">Capaciteit: <span th:text="${evenement.locatie.capaciteit}">0</span> personen</span>
                </dd>
            </div>
        </dl>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
