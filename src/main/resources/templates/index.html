<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head th:replace="~{fragments/header :: head}"></head>
<body class="overflow-x-hidden">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <div th:if="${param.succes}" class="bg-brand-50 border-l-4 border-brand-500 text-brand-800 px-5 py-4 rounded-r-lg mb-6 flex items-center gap-3">
        <svg class="w-5 h-5 text-brand-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <span class="font-semibold">Evenement succesvol toegevoegd!</span>
    </div>

    <h1 class="text-3xl font-extrabold text-brand-900 mb-6">Laatste evenementen</h1>

    <div class="overflow-x-auto bg-white rounded-2xl card-shadow">
        <table class="min-w-full divide-y divide-brand-100">
            <thead class="bg-brand-50">
                <tr>
                    <th class="px-6 py-4 text-left text-xs font-bold text-brand-700 uppercase tracking-wider">Titel</th>
                    <th class="px-6 py-4 text-left text-xs font-bold text-brand-700 uppercase tracking-wider">Organisatie</th>
                    <th class="px-6 py-4 text-center text-xs font-bold text-brand-700 uppercase tracking-wider"></th>
                </tr>
            </thead>
            <tbody class="divide-y divide-brand-50">
                <tr th:each="e : ${evenementen}" class="hover:bg-brand-50/50 transition-colors">
                    <td class="px-6 py-4 text-sm font-semibold text-brand-900" th:text="${e.titel}">Titel</td>
                    <td class="px-6 py-4 text-sm text-brand-600" th:text="${e.organisatie}">Organisatie</td>
                    <td class="px-6 py-4 text-center">
                        <a th:href="@{/details/{id}(id=${e.id})}" class="btn-accent inline-block text-white px-5 py-1.5 rounded-full text-sm font-semibold">Bekijk</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-8">
        <a th:href="@{/new}" class="btn-brand inline-block text-white px-7 py-3 rounded-full font-bold shadow-lg">+ Nieuw evenement toevoegen</a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
