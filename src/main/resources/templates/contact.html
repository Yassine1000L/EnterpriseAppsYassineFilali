<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head th:replace="~{fragments/header :: head}"></head>
<body class="overflow-x-hidden">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold text-brand-900 mb-6">Contact</h1>

    <div th:if="${succes}" class="bg-brand-50 border-l-4 border-brand-500 text-brand-800 px-5 py-4 rounded-r-lg mb-6 flex items-center gap-3">
        <svg class="w-5 h-5 text-brand-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <span class="font-semibold">Uw bericht is succesvol verzonden!</span>
    </div>
    <div th:if="${error}" class="bg-red-50 border-l-4 border-red-500 text-red-800 px-5 py-4 rounded-r-lg mb-6 flex items-center gap-3">
        <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
        <span class="font-semibold">Er is een fout opgetreden. Probeer later opnieuw.</span>
    </div>

    <form th:action="@{/contact}" th:object="${contactBericht}" method="post" class="bg-white rounded-2xl card-shadow p-8 space-y-5 max-w-2xl">
        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Naam</label>
            <input type="text" th:field="*{naam}" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
            <p th:if="${#fields.hasErrors('naam')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{naam}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Email</label>
            <input type="email" th:field="*{email}" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
            <p th:if="${#fields.hasErrors('email')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{email}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Onderwerp</label>
            <input type="text" th:field="*{onderwerp}" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
            <p th:if="${#fields.hasErrors('onderwerp')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{onderwerp}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Bericht</label>
            <textarea th:field="*{bericht}" rows="6" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition"></textarea>
            <p th:if="${#fields.hasErrors('bericht')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{bericht}">Fout</p>
        </div>

        <div class="pt-4">
            <button type="submit" class="btn-brand text-white px-8 py-3 rounded-full font-bold shadow-lg">Verstuur bericht</button>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
