<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head th:replace="~{fragments/header :: head}"></head>
<body class="overflow-x-hidden">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Laatste evenementen</h1>

    <div class="overflow-x-auto bg-white rounded-lg shadow">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Titel</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Organisatie</th>
                    <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Details</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-200">
                <tr th:each="e : ${evenementen}" class="hover:bg-gray-50">
                    <td class="px-6 py-4 text-sm text-gray-900" th:text="${e.titel}">Titel</td>
                    <td class="px-6 py-4 text-sm text-gray-700" th:text="${e.organisatie}">Organisatie</td>
                    <td class="px-6 py-4 text-center">
                        <a th:href="@{/details/{id}(id=${e.id})}" class="inline-block bg-emerald-600 text-white px-4 py-1 rounded hover:bg-emerald-700 text-sm">Bekijk</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-6">
        <a th:href="@{/new}" class="inline-block bg-emerald-700 text-white px-6 py-3 rounded-lg hover:bg-emerald-800 shadow">Nieuw evenement toevoegen</a>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
