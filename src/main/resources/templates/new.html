<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head th:replace="~{fragments/header :: head}"></head>
<body class="overflow-x-hidden">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold text-brand-900 mb-6">Nieuw evenement</h1>

    <form th:action="@{/new}" th:object="${evenement}" method="post" class="bg-white rounded-2xl card-shadow p-8 space-y-5 max-w-2xl">
        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Titel</label>
            <input type="text" th:field="*{titel}" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
            <p th:if="${#fields.hasErrors('titel')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{titel}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Omschrijving</label>
            <textarea th:field="*{omschrijving}" rows="4" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition"></textarea>
            <p th:if="${#fields.hasErrors('omschrijving')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{omschrijving}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Organisatie</label>
            <input type="text" th:field="*{organisatie}" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
            <p th:if="${#fields.hasErrors('organisatie')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{organisatie}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Mail contactpersoon</label>
            <input type="email" th:field="*{mailContactpersoon}" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
            <p th:if="${#fields.hasErrors('mailContactpersoon')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{mailContactpersoon}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Tijdstip</label>
            <input type="datetime-local" th:field="*{tijdstip}" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
            <p th:if="${#fields.hasErrors('tijdstip')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{tijdstip}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-bold text-brand-800 mb-1">Locatie</label>
            <select th:field="*{locatieId}" class="block w-full border-2 border-brand-200 rounded-xl p-3 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition">
                <option value="">-- Kies een locatie --</option>
                <option th:each="l : ${locaties}" th:value="${l.id}" th:text="${l.naam + ' - ' + l.adres}"></option>
            </select>
            <p th:if="${#fields.hasErrors('locatieId')}" class="text-red-500 text-sm mt-1 font-medium" th:errors="*{locatieId}">Fout</p>
        </div>

        <div class="pt-4 flex items-center gap-4">
            <button type="submit" class="btn-brand text-white px-8 py-3 rounded-full font-bold shadow-lg">Opslaan</button>
            <a th:href="@{/}" class="text-brand-500 hover:text-brand-700 font-semibold transition">Annuleren</a>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
