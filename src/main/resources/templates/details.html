<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head th:replace="~{fragments/header :: head}"></head>
<body class="overflow-x-hidden">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <div class="mb-6">
        <a th:href="@{/}" class="text-emerald-700 hover:text-emerald-900">&larr; Terug naar overzicht</a>
    </div>

    <div class="bg-white rounded-lg shadow p-6 max-w-3xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-4" th:text="${evenement.titel}">Titel</h1>

        <dl class="space-y-4">
            <div>
                <dt class="text-sm text-gray-500">Tijdstip</dt>
                <dd class="text-gray-800" th:text="${#temporals.format(evenement.tijdstip, 'dd/MM/yyyy HH:mm')}">Datum</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Omschrijving</dt>
                <dd class="text-gray-800" th:text="${evenement.omschrijving}">Omschrijving</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Organisatie</dt>
                <dd class="text-gray-800" th:text="${evenement.organisatie}">Organisatie</dd>
            </div>
            <div>
                <dt class="text-sm text-gray-500">Contactpersoon</dt>
                <dd class="text-gray-800" th:text="${evenement.mailContactpersoon}">Email</dd>
            </div>
            <div th:if="${evenement.locatie != null}">
                <dt class="text-sm text-gray-500">Locatie</dt>
                <dd class="text-gray-800">
                    <span th:text="${evenement.locatie.naam}">Naam</span><br>
                    <span th:text="${evenement.locatie.adres}" class="text-gray-600">Adres</span><br>
                    <span class="text-gray-600">Capaciteit: <span th:text="${evenement.locatie.capaciteit}">0</span> personen</span>
                </dd>
            </div>
        </dl>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
