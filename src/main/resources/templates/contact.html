<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="nl">
<head th:replace="~{fragments/header :: head}"></head>
<body class="overflow-x-hidden">
<nav th:replace="~{fragments/header :: header}"></nav>
<main class="max-w-6xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Contact</h1>

    <div th:if="${succes}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
        Uw bericht is succesvol verzonden! We nemen zo snel mogelijk contact met u op.
    </div>
    <div th:if="${error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        Er is een fout opgetreden bij het versturen van uw bericht. Probeer later opnieuw.
    </div>

    <form th:action="@{/contact}" th:object="${contactBericht}" method="post" class="bg-white rounded-lg shadow p-6 space-y-4 max-w-2xl">
        <div>
            <label class="block text-sm font-medium text-gray-700">Naam</label>
            <input type="text" th:field="*{naam}" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-emerald-500 focus:border-emerald-500">
            <p th:if="${#fields.hasErrors('naam')}" class="text-red-600 text-sm mt-1" th:errors="*{naam}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Email</label>
            <input type="email" th:field="*{email}" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-emerald-500 focus:border-emerald-500">
            <p th:if="${#fields.hasErrors('email')}" class="text-red-600 text-sm mt-1" th:errors="*{email}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Onderwerp</label>
            <input type="text" th:field="*{onderwerp}" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-emerald-500 focus:border-emerald-500">
            <p th:if="${#fields.hasErrors('onderwerp')}" class="text-red-600 text-sm mt-1" th:errors="*{onderwerp}">Fout</p>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Bericht</label>
            <textarea th:field="*{bericht}" rows="6" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-emerald-500 focus:border-emerald-500"></textarea>
            <p th:if="${#fields.hasErrors('bericht')}" class="text-red-600 text-sm mt-1" th:errors="*{bericht}">Fout</p>
        </div>

        <div class="pt-4">
            <button type="submit" class="bg-emerald-700 text-white px-6 py-3 rounded-lg hover:bg-emerald-800 shadow">Verstuur bericht</button>
        </div>
    </form>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
